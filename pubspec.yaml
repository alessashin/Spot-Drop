name: spot_drop
description: Local Community Goods Sharing & Micro-Lending App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter


  # Firebase Core & Database
  firebase_core: ^3.15.2
  cloud_firestore: ^5.0.1
  firebase_storage: ^12.0.1

  # Cross-Platform Interactive Mapping (Android + Web)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  flutter_map_location_marker: ^9.1.1
  flutter_polyline_points: ^3.1.0

  # State Management & Utilities
  provider: ^6.1.2
  image_picker: ^1.1.2
  intl: ^0.19.0
  uuid: ^4.4.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true